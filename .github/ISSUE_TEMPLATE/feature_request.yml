name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["type:feat", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. The clearer your description, the faster a maintainer (or AFK agent) can scope it.

  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: A clear description of the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why does this matter?
      description: What problem does it solve? Who benefits? Any workflow it unblocks?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: How would you implement it? CLI command, dashboard panel, config option, etc.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Other approaches you thought about and why they don't fit.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - CLI
        - Web dashboard
        - API server
        - Classifier / analyzer
        - Documentation
        - Build / release
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Are you willing to contribute?
      options:
        - label: I am willing to open a PR for this
        - label: I can help with testing
        - label: I can help with documentation
